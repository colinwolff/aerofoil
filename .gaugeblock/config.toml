# gaugeblock suite configuration for the `aerofoil` workspace.
#
# This file is TRACKED (see `.gitignore`): it is canonical, reproducible state, not
# machine state. Derived artefacts (`storypole/index.sqlite`, `spool/`, `worktrees/`)
# are per-machine and ignored.

[storypole]
# Task keys are `AF-<n>`. This unified `[storypole]` table takes precedence over the
# legacy `.gaugeblock/storypole/config.toml` — both are kept in sync so either read
# path yields the same configuration.
ticket_prefix = "AF"
allowed_repos = ["aerofoil"]
allowed_crates = [
    "aerofoil-common",
    "aerofoil-1090",
    "aerofoil-978",
    "aerofoil-tracker",
    "aerofoil-server",
    "aerofoil-cli",
    "aerofoil-tui",
    "aerofoil-mcp",
    "aerofoil-sdr",
    "aerofoil-persistence",
    "aerofoil-replay",
    "aerofoil-mlat",
]
claim_ttl_minutes = 60

# `crate_or_repo -> Tier 2 command` pairs executed by `storypole verify`. The lookup tries the crate
# name first, then the repository name, each exactly; only then does it take the reserved `default`
# key. A receipt produced by an executed chain therefore records a command that actually ran, instead
# of certifying what an agent claims to have run by hand.
#
# The `default` entry below is what an unscoped ticket resolves to — one with neither a crate nor a
# repository, which is every harness-level task in this repo (`AF-19`, `AF-22`, `AF-99`). Without it
# those tickets fall through to the hardcoded `cargo test` and certify less than this gate does.
verification_commands = [
    ["aerofoil", "cargo nextest run --workspace"],
    ["aerofoil-common", "cargo nextest run -p aerofoil-common"],
    ["aerofoil-1090", "cargo nextest run -p aerofoil-1090"],
    ["aerofoil-978", "cargo nextest run -p aerofoil-978"],
    ["aerofoil-tracker", "cargo nextest run -p aerofoil-tracker"],
    ["aerofoil-cli", "cargo nextest run -p aerofoil-cli"],
    ["aerofoil-tui", "cargo nextest run -p aerofoil-tui"],
    ["aerofoil-persistence", "cargo nextest run -p aerofoil-persistence"],
    ["aerofoil-sdr", "cargo nextest run -p aerofoil-sdr"],
    ["aerofoil-server", "cargo nextest run -p aerofoil-server"],
    ["aerofoil-mcp", "cargo nextest run -p aerofoil-mcp"],
    ["aerofoil-replay", "cargo nextest run -p aerofoil-replay"],
    ["aerofoil-mlat", "cargo nextest run -p aerofoil-mlat"],
    # Reserved key: the chain for tickets scoped to neither a crate nor a repository.
    ["default", "cargo nextest run --workspace"],
]
