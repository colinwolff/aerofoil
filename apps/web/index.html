<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aerofoil — Live Airspace Web Radar</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="dark-theme">
    <header id="header" class="flex items-center justify-between px-3 py-1.5 border-b border-slate-800 bg-slate-900/90 backdrop-blur z-50">
      <div class="flex items-center gap-3">
        <div class="logo flex items-center gap-2">
          <span class="badge bg-sky-700 text-white font-bold text-xs px-2 py-0.5 rounded tracking-wide">AEROFOIL</span>
          <h1 class="text-sm font-semibold text-slate-100 hidden sm:inline">Airspace Radar</h1>
        </div>
        <nav class="toolbar flex items-center gap-1.5 ml-2">
          <button type="button" id="btn-toggle-layers" class="toolbar-btn" title="Toggle Layers & Overlays (L)">
            <span>⛯</span> Layers
          </button>
          <button type="button" id="btn-toggle-weather" class="toolbar-btn" title="Toggle Live NEXRAD Weather (W)">
            <span>⛅</span> Weather
          </button>
          <button type="button" id="btn-toggle-trails" class="toolbar-btn" title="Toggle Aircraft Flight Trails (T)">
            <span>〰</span> Trails
          </button>
          <button type="button" id="btn-toggle-labels" class="toolbar-btn active" title="Toggle Aircraft Callsign Labels (K)">
            <span>🏷</span> Labels
          </button>
          <div class="relative">
            <button type="button" id="btn-center-menu" class="toolbar-btn" title="Center View">
              <span>⌖</span> Center ▾
            </button>
            <div id="center-menu-dropdown" class="dropdown-menu hidden">
              <button type="button" id="btn-center-receiver" class="dropdown-item">Receiver Home</button>
              <button type="button" id="btn-center-conus" class="dropdown-item">US CONUS (FAA Charts)</button>
              <button type="button" id="btn-center-europe" class="dropdown-item">Europe Hub (AMS)</button>
              <button type="button" id="btn-center-rainier" class="dropdown-item">3D Terrain: Mt. Rainier (SEA)</button>
              <button type="button" id="btn-center-alps" class="dropdown-item">3D Terrain: Swiss Alps (LSGS)</button>
              <button type="button" id="btn-center-gps" class="dropdown-item">My GPS Location</button>
            </div>
          </div>
          <button type="button" id="btn-open-settings" class="toolbar-btn" title="Configure Maps & API Keys">
            <span>⚙</span> Settings
          </button>
          <div class="engine-toggle-group" title="Map Viewport Mode">
            <button type="button" id="btn-engine-2d" class="engine-seg-btn active" title="2D Tactical Radar View (Leaflet)">2D</button>
            <button type="button" id="btn-engine-3d" class="engine-seg-btn" title="3D Globe & Elevation Profile View (MapLibre GL)">3D</button>
          </div>
          <button type="button" id="btn-toggle-theme" class="toolbar-btn" title="Toggle Light / Dark Theme">
            <span>☼</span>
          </button>
          <button type="button" id="btn-toggle-sidebar" class="toolbar-btn" title="Toggle Telemetry Sidebar (C)">
            <span>◨</span> Sidebar
          </button>
        </nav>
      </div>
      <div class="metrics flex items-center gap-3 font-mono text-xs">
        <span id="utc-clock" class="text-slate-400">00:00:00 UTC</span>
        <span id="target-count" class="text-sky-400 font-bold">Targets: 0</span>
        <span id="connection-status" class="status-badge connecting">Connecting...</span>
      </div>
    </header>

    <main id="app-container">
      <div id="map-container">
        <div id="map"></div>
        <div id="map-3d" class="hidden"></div>
        <div id="layer-drawer-container" class="layer-drawer-hud"></div>
        <div id="weather-scrubber-dock" class="weather-scrubber-dock hidden"></div>
        <div id="aircraft-inspector-container" class="aircraft-inspector-hud hidden"></div>
      </div>
      <div id="sidebar-splitter" class="splitter-gutter" title="Drag to resize, double-click to collapse"></div>
      <aside id="table-container">
        <div class="sidebar-header flex justify-between items-center mb-1 pb-1 border-b border-slate-800">
          <h2>Live Airspace Telemetry</h2>
          <button type="button" id="btn-collapse-sidebar" class="collapse-icon-btn" title="Collapse sidebar">»</button>
        </div>
        <div id="filter-bar" class="filter-bar-container px-2 py-1.5 mb-2 border-b border-slate-800 bg-slate-900/60 rounded flex flex-col gap-1.5">
          <div class="flex items-center gap-1.5">
            <div class="relative flex-1">
              <input type="text" id="filter-search-input" class="w-full bg-slate-950/80 border border-slate-700 rounded px-2 py-1 text-xs text-slate-100 placeholder-slate-500 font-mono focus:outline-none focus:border-sky-500" placeholder="Filter / Regex (^UAL|DAL)" />
              <button type="button" id="btn-clear-search" class="absolute right-1.5 top-1 text-slate-500 hover:text-slate-200 text-xs hidden" title="Clear search">✕</button>
            </div>
            <button type="button" id="btn-toggle-filters" class="toolbar-btn text-xs px-2 py-1" title="Altitude, speed, and provenance filters">
              <span>⚙</span> Filter ▾
            </button>
          </div>
          <div id="filter-drawer" class="filter-drawer-panel hidden bg-slate-950/90 border border-slate-800 rounded p-2 text-xs flex flex-col gap-2">
            <div class="flex items-center justify-between text-slate-300">
              <span class="font-bold text-sky-400">Altitude Filter:</span>
              <span id="filter-alt-label" class="font-mono text-[11px] text-slate-400">FL0 – FL600</span>
            </div>
            <div class="flex items-center gap-2">
              <input type="range" id="filter-alt-min" min="0" max="600" step="10" value="0" class="w-full accent-sky-400 h-1 bg-slate-800 rounded" title="Min Altitude (FL)" />
              <input type="range" id="filter-alt-max" min="0" max="600" step="10" value="600" class="w-full accent-sky-400 h-1 bg-slate-800 rounded" title="Max Altitude (FL)" />
            </div>
            <div class="flex items-center justify-between text-slate-300">
              <span class="font-bold text-sky-400">Speed Filter:</span>
              <span id="filter-spd-label" class="font-mono text-[11px] text-slate-400">0 – 1200 kt</span>
            </div>
            <div class="flex items-center gap-2">
              <input type="range" id="filter-spd-min" min="0" max="1000" step="25" value="0" class="w-full accent-sky-400 h-1 bg-slate-800 rounded" title="Min Ground Speed (kt)" />
              <input type="range" id="filter-spd-max" min="0" max="1200" step="25" value="1200" class="w-full accent-sky-400 h-1 bg-slate-800 rounded" title="Max Ground Speed (kt)" />
            </div>
            <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-[11px]">
              <span class="font-bold text-slate-400">Sources:</span>
              <div class="flex items-center gap-3 text-slate-300">
                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="filter-src-adsb" checked class="accent-sky-400" /> 1090ES</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="filter-src-uat" checked class="accent-sky-400" /> UAT</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="filter-src-mlat" checked class="accent-sky-400" /> MLAT</label>
              </div>
            </div>
            <div class="flex justify-end pt-1">
              <button type="button" id="btn-reset-filters" class="text-[10px] text-slate-400 hover:text-sky-400">Reset Filters</button>
            </div>
          </div>
        </div>
        <div class="table-scroll">
          <table id="telemetry-table">
            <thead>
              <tr>
                <th>Address</th>
                <th>Callsign</th>
                <th>Altitude</th>
                <th>Speed</th>
                <th>Heading</th>
                <th>Squawk</th>
                <th>Source</th>
              </tr>
            </thead>
            <tbody id="telemetry-body">
              <tr class="empty-row"><td colspan="7">Awaiting surveillance broadcasts...</td></tr>
            </tbody>
          </table>
        </div>
      </aside>
    </main>

    <footer id="footer">
      <div id="attribution-container"></div>
    </footer>

    <div id="config-modal-container"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
