apiVersion: v1
kind: Service
metadata:
  name: {{ include "aerofoil.fullname" . }}
  labels:
    {{- include "aerofoil.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http-egress
      port: {{ .Values.service.httpPort }}
      targetPort: http-egress
      protocol: TCP
    - name: beast-1090
      port: {{ .Values.service.port1090 }}
      targetPort: beast-1090
      protocol: TCP
    - name: beast-978
      port: {{ .Values.service.port978 }}
      targetPort: beast-978
      protocol: TCP
  selector:
    {{- include "aerofoil.selectorLabels" . | nindent 4 }}
