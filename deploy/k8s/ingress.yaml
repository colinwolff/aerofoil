apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aerofoil-radar-ingress
  labels:
    app.kubernetes.io/name: aerofoil
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "aerofoil-server"
spec:
  rules:
    - host: radar.aerofoil.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aerofoil-server
                port:
                  name: http-egress
