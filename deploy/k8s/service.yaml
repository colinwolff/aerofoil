apiVersion: v1
kind: Service
metadata:
  name: aerofoil-server
  labels:
    app.kubernetes.io/name: aerofoil
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - name: http-egress
      port: 3000
      targetPort: http-egress
      protocol: TCP
    - name: beast-1090
      port: 30005
      targetPort: beast-1090
      protocol: TCP
    - name: beast-978
      port: 30978
      targetPort: beast-978
      protocol: TCP
  selector:
    app.kubernetes.io/name: aerofoil
    app.kubernetes.io/component: server
